plugins {
    id 'org.springframework.boot' version '4.0.9'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.openrewrite.rewrite' version '7.39.0'
    id 'java'
}

rewrite {
    activeRecipe("org.openrewrite.java.spring.boot4.UpgradeSpringBoot_4_0")
    setExportDatatables(false)
}

group = 'io.kluev'
version = project.properties["appVersion"]

java.sourceCompatibility = '21'

bootRun {
    environment SPRING_PROFILES_ACTIVE: environment.SPRING_PROFILES_ACTIVE ?: 'local'
}

springBoot {
    buildInfo()

    bootBuildImage {
        imageName = "${project.group}/${project.name}"
        docker {
            def baseImageName = "${project.group}/${project.name}"
            tags.add("${baseImageName}:${project.version}")
            tags.add("${baseImageName}:latest")
        }
    }
}

repositories {
    mavenCentral()
}

def restateVersion = "2.6.0"

dependencies {
    implementation('org.springframework.boot:spring-boot-starter-webmvc')
    implementation('org.springframework.boot:spring-boot-starter-validation')
    implementation('org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3')
    implementation('org.springframework.boot:spring-boot-starter-jdbc')
    implementation "org.springframework.boot:spring-boot-starter-restclient:4.0.9"
    implementation('org.springframework.boot:spring-boot-starter-actuator')

    implementation('org.apache.commons:commons-lang3:3.14.0')
    implementation('org.springframework.retry:spring-retry:2.0.13')
    implementation('commons-io:commons-io:2.15.1')
    implementation('org.apache.httpcomponents.client5:httpclient5')
    implementation('com.google.apis:google-api-services-sheets:v4-rev612-1.25.0')
    implementation('org.apache.commons:commons-collections4:4.5.0-M1')
    implementation('org.telegram:telegrambots-springboot-longpolling-starter:7.3.0')
    implementation('org.telegram:telegrambots-client:7.3.0')
    implementation('jakarta.validation:jakarta.validation-api:3.1.0')
    implementation('tools.jackson.dataformat:jackson-dataformat-xml')
    implementation('org.postgresql:postgresql')
    implementation('io.micrometer:micrometer-registry-prometheus')
    implementation('com.squareup.okhttp3:okhttp:4.12.0')
    implementation('net.logstash.logback:logstash-logback-encoder:7.2')
    implementation("dev.restate:sdk-spring-boot-starter:${restateVersion}")
    implementation('io.temporal:temporal-spring-boot-starter:1.38.0')
    implementation("com.vk.api:sdk:1.0.16")
    implementation('com.google.code.gson:gson:2.10.1')


    compileOnly('org.projectlombok:lombok')
    annotationProcessor('org.projectlombok:lombok')
    testCompileOnly('org.projectlombok:lombok')
    testAnnotationProcessor('org.projectlombok:lombok')
    annotationProcessor "dev.restate:sdk-api-gen:${restateVersion}"

    testImplementation('org.springframework.boot:spring-boot-starter-test')
    testImplementation('com.maciejwalkowiak.spring:wiremock-spring-boot:2.1.2')
    testImplementation('org.testcontainers:testcontainers-postgresql:2.0.5')
    testImplementation('org.testcontainers:testcontainers-junit-jupiter:2.0.5')
    testImplementation('org.springframework.boot:spring-boot-testcontainers')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')

    rewrite("org.openrewrite.recipe:rewrite-spring:6.37.1")

    runtimeOnly "javax.xml.bind:jaxb-api:2.3.1"

    // Обязательно укажите processor path явно
    tasks.withType(JavaCompile) {
        options.annotationProcessorPath = configurations.annotationProcessor
    }
}

tasks.register("integrationTest", Test) {
    group = "verification"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags("IntegrationTest")
    }
}

tasks.register("unitTest", Test) {
    group = "verification"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        excludeTags("IntegrationTest")
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform() {
    }
    environment "TESTCONTAINERS_RYUK_DISABLED", "true"
}

tasks.named("test").configure {
    useJUnitPlatform() {
        excludeTags("IntegrationTest")
    }
}

