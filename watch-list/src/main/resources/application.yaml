server:
  port: 8060

spring:
  application:
    name: watch-list
  datasource:
    url: jdbc:postgresql://localhost:5432/watch_list
    username: postgres
    password: postgres
  sql:
    init.mode: always

  temporal:
    connection:
      target: localhost:7233
    namespace: default
    workers-auto-discovery:
      enabled: true
      workflow-packages:
        - io.kluev.watchlist.app.searchmovie.temporal
        - io.kluev.watchlist.app.searchcontent.temporal

workflow-engine: TEMPORAL

restate:
  client:
    base-uri: http://localhost:8080


integration:
  node-red:
    url: http://${CURR_HOST:localhost}:1880
    play-video-url: /play

  video-server:
    base-url: http://localhost:8000
    video-path-template: /video/%s?path=%s&videoType=%s

  google:
    credentialsFile: <path to your credentials JSON file>
    spreadsheet:
      spreadsheetId: <your spreadsheet ID>
      sheets:
        moviesToWatch:
          headerRange: Посмотреть!R1C1:R1C12
          columnsMapping:
            fullName: Название фильма(year, EngName)
            preComment: ПреКоммент
            kinopoiskId: KinopoiskId
            readyToWatch: ReadyToWatch
            file: File
        watchedMovies:
          headerRange: Просмотренные!R1C1:R1C12
          columnsMapping:
            fullName: Название фильма(year, EngName)
            watchedAt: Дата просмотра
            preComment: ПреКоммент
            postComment: ПостКоммент
            kinopoiskId: KinopoiskId
        series:
          headerRange: Сериалы!R1C1:R1C4
          columnsMapping:
            name: Название
            seasonNumber: Номер сезона
            lastWatchedEpisodeNumber: Номер эпизода
            episodesCount: Всего серий
        watchedSeries:
          headerRange: Просмотренные сериалы!R1C1:R1C2
          columnsMapping:
            name: Название
            watchedAt: Дата просмотра

  kinopoisk:
    apiKey: <your Kinopoisk API Key>

  telegram-bot:
    enabled: false
    apiKey: <your bot API key>
    allowedUsers: <comma separated list of usernames of allowed users>
    admins: <comma separated list of usernames of admins>
    sessionStoreType: PG

  chats:
    vkontakte:
      enabled: false
      group-id: <your group ID number>
      group-token: <your group token>
      admins: <comma separated list of usernames of admins>

  jackett:
    enabled: false
    apiKey: <your Jackett API key>
    baseUrl: http://localhost:9117
  jacred:
    enabled: true
    # apiKey: <your JacRed API key>
    baseUrl: https://jac-red.ru
    sort: pir
    # set trackers whitelist
#    trackers:
#      - mytracker
#      - anotherone
  prowlarr:
    enabled: false
    apiKey: <your Prowlarr API key>
    baseUrl: http://localhost:9696
  qbit:
    url: http://localhost:8080
    # How long to wait for a magnet link metadata to be resolved before adding the torrent
    metadata-timeout: 60s

download:
  min-free-disk-space: 40GB
  max-ready-to-watch: 4
  # How long DownloadContentProcess.start() polls qBittorrent for content_path before giving up
  content-path-poll-timeout: 60s

search-content:
  torrFolder: /home/${USER}/Downloads/torr

management:
  endpoint:
    shutdown:
      access: read-only
    info.access: read-only
    health.probes.enabled: true
  endpoints:
    web:
      exposure:
        include: metrics,loggers,prometheus,info,shutdown,threaddump,health